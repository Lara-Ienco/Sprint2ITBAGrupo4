<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Producto</title>
  <link rel="stylesheet" href="catalogo.css">
  <script defer src="../productos.js"></script>
  <script defer src="producto.js"></script>
</head>
<body>
  <header>
    <h1>Hermanos Jota</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
      </ul>
    </nav>
  </header>

  <main class="detalle">
    <div class="detalle-container">
      <img id="imagen" alt="Imagen del producto">
      <div class="detalle-producto-container">
        <h1 id="nombre"></h1>
        <p id="descripcion"></p>
        <p><strong>Medidas:</strong> <span id="medidas"></span></p>
        <p><strong>Materiales:</strong> <span id="materiales"></span></p>
        <p><strong>Acabado:</strong> <span id="acabado"></span></p>
        <p><strong>Detalles:</strong> <span id="extra"></span></p>
        <p class="precio" id="precio"></p>
        <button>Añadir al Carrito</button>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Hermanos Jota</p>
  </footer>
</body>
</html>
